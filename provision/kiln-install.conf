# Optional install options for the zero-touch install (vendor-data).
# Copy this file to the SD card's boot partition next to vendor-data and
# edit it. Lines are KEY=value; nothing in here is executed.

# Which code to install. Change these to install your own fork.
REPO_URL=https://github.com/adman234/kiln-controller
BRANCH=main

# 1 = fewer SD card writes (logs and /tmp in RAM, no swap file). Logs are
# lost on reboot. Recommended for a Pi Zero.
PROTECT_SD=1

# 1 = install Tailscale for safe remote access from your phone.
# Paste a reusable or one-off auth key from https://login.tailscale.com/admin/settings/keys
# to join your tailnet automatically (the key is removed from this file after use).
TAILSCALE=0
TAILSCALE_AUTHKEY=

# The user that runs the controller. Empty = the user you created in Imager.
KILN_USER=

# 1 = reboot when finished (recommended, makes sure SPI is enabled).
REBOOT=1
